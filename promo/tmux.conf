# hero.tape 녹화 전용 tmux 설정이다. 사용자의 ~/.tmux.conf 대신 scene.sh가 -f로 읽는다.
set -g default-command "bash --noprofile --norc"
set -g escape-time 0
set -g status-position top
set -g status-style "bg=#5f5fd7,fg=#ffffff,bold"
set -g status-left-length 100
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g pane-border-style "fg=#585858"
set -g pane-active-border-style "fg=#585858"
