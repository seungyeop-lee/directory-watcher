name: dw-4rw Windows diagnostic

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DW_LIFETIME_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare source ownership and registration count
        run: go test -count=3 -race -v -timeout=5m ./internal/app/service -run '^TestWindowsCleanupDiagnostic$'
      - name: Observe existing synthetic consumers and Close results
        if: ${{ !cancelled() }}
        run: go test -count=1 -race -v -timeout=3m ./internal/app/service -run '^(TestStopDiscardsPendingEvents|TestWatcherLossStopsDispatchWhileHookRuns|TestRunnerPreservesOnlyFirstFatalError|TestBoundedDispatchReportsLoss|TestFatalLossCancelsEveryTargetBeforeNotificationCompletes|TestFatalLossNotificationReceivesOriginalContext|TestNotificationFailureAndTimeoutPreserveFirstError)$'
