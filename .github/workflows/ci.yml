name: ci

on:
  # master는 배포에 성공한 v<major>의 커밋으로 fast-forward만 하므로, master push에서는 같은 커밋을 다시 검사하지 않는다.
  # branches-ignore를 적으면 tag push에서도 실행하지 않는다.
  push:
    branches-ignore:
      - master
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 다시 push하면 이전 실행을 취소한다. 다만 v<major> push의 실행은 release job이 게시하는 도중일 수 있으므로 취소하지 않는다.
# 이름이 v로 시작하는 다른 브랜치도 취소하지 않지만, 배포는 goreleaser.yml이 브랜치 이름을 확인한 뒤에만 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/heads/v') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Configure E2E diagnostics
        shell: bash
        run: echo "DW_E2E_DIAGNOSTICS=$RUNNER_TEMP/dw-e2e" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 -race ./...
      - name: Smoke test config.example.yml
        if: ${{ runner.os == 'Linux' }}
        run: make smoke-example
      - name: Verify Windows error notification process trees
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        env:
          DW_E2E_KEEP: '1'
        run: |
          New-Item -ItemType Directory -Force $env:DW_E2E_DIAGNOSTICS | Out-Null
          go test -count=1 -race -v -timeout=4m -run '^TestEventLossNotificationCLI$' ./e2e/scenarios 2>&1 | Tee-Object -FilePath (Join-Path $env:DW_E2E_DIAGNOSTICS 'notification.log')
          if ($LASTEXITCODE -ne 0) { throw "Windows error notification acceptance failed: $LASTEXITCODE" }
      - name: Repeat Windows graceful lifecycle without test cache
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          go test -count=3 -v -timeout=5m -run '^(TestGoldenPath|TestProcessLifecycle|TestStartHookShutdownModes)$' ./e2e/scenarios
          if ($LASTEXITCODE -ne 0) { throw "Windows lifecycle repetition failed: $LASTEXITCODE" }
      - name: Verify Windows failure and timeout diagnostics
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force $env:DW_E2E_DIAGNOSTICS | Out-Null
          $guardBin = Join-Path $env:DW_E2E_DIAGNOSTICS 'cleanup-guard.exe'
          $guardRecords = Join-Path $env:DW_E2E_DIAGNOSTICS 'cleanup-guard.records'
          go build -o $guardBin ./e2e/hookrec
          if ($LASTEXITCODE -ne 0) { throw "Cleanup guard build failed" }
          $guard = Start-Process -FilePath $guardBin -ArgumentList "--file=$guardRecords", '--depth=2' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              $ready = @(Get-Content $guardRecords -ErrorAction SilentlyContinue | Select-String '\|ready$')
              if ((Get-Date) -gt $deadline -or $guard.HasExited) { throw "Cleanup guard did not become ready" }
              if ($ready.Count -ne 3) { Start-Sleep -Milliseconds 20 }
            } until ($ready.Count -eq 3)
            foreach ($fault in 'failure', 'timeout') {
              $env:DW_E2E_FAULT = $fault
              $log = Join-Path $env:DW_E2E_DIAGNOSTICS "$fault.log"
              go test -count=1 -v -timeout=2m -run '^TestProcessLifecycle$' ./e2e/scenarios 2>&1 | Tee-Object -FilePath $log
              $status = $LASTEXITCODE
              Remove-Item Env:DW_E2E_FAULT
              if ($status -eq 0) { throw "Intentional $fault unexpectedly passed" }
              $output = Get-Content $log -Raw
              $expected = if ($fault -eq 'timeout') { 'timeout: intentional timeout' } else { 'intentional failure after process tree readiness' }
              if (-not $output.Contains($expected)) { throw "Missing $fault diagnostic" }
              $matches = [regex]::Matches($output, 'diagnostics retained: ([^\r\n]+)')
              if ($matches.Count -ne 1) { throw "Expected one retained diagnostic directory" }
              $dir = $matches[0].Groups[1].Value.Trim()
              foreach ($name in 'records.log', 'watcher.log', 'watcher.pid', 'cleanup.log', 'records.log.processes') {
                if (-not (Test-Path (Join-Path $dir $name))) { throw "Missing $name" }
              }
              $cleanup = Get-Content (Join-Path $dir 'cleanup.log') -Raw
              if (($cleanup | Select-String -Pattern 'alive=false' -AllMatches).Matches.Count -ne 3 -or $cleanup.Contains('alive=true')) {
                throw "Process cleanup did not confirm three terminated helpers: $cleanup"
              }
              if ($output.Contains('process cleanup failed')) { throw "Cleanup failed" }
              $watcherPid = [int](Get-Content (Join-Path $dir 'watcher.pid'))
              if (Get-Process -Id $watcherPid -ErrorAction SilentlyContinue) { throw "Watcher remains after cleanup" }
              foreach ($record in $ready) {
                $guardPid = [int]($record.Line.Split('|')[1])
                if (-not (Get-Process -Id $guardPid -ErrorAction SilentlyContinue)) { throw "Cleanup killed unrelated guard PID $guardPid" }
              }
              Write-Output "$fault diagnostics verified; unrelated guard parent/child/grandchild still alive"
            }
          } finally {
            Remove-Item Env:DW_E2E_FAULT -ErrorAction SilentlyContinue
            if (-not $guard.HasExited) {
              taskkill /T /F /PID $guard.Id
              if ($LASTEXITCODE -ne 0) { throw "Cleanup guard removal failed" }
              if (-not $guard.WaitForExit(3000)) { throw "Cleanup guard did not exit" }
            }
          }
          $global:LASTEXITCODE = 0
      - name: Preserve E2E failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ matrix.os }}
          path: ${{ env.DW_E2E_DIAGNOSTICS }}
          if-no-files-found: ignore

  # v<major> push에서 test가 모든 OS에서 성공하면 같은 커밋을 배포한다. goreleaser.yml은 검사를 다시 하지 않는다.
  # 같은 저장소의 reusable workflow는 push한 커밋의 파일로 실행되므로, goreleaser.yml을 고친 내용도 그 push부터 적용된다.
  release:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v')
    permissions:
      contents: write # tag, GitHub Release
      packages: write # ghcr Docker 이미지
    uses: ./.github/workflows/goreleaser.yml
    secrets:
      TAP_SSH_KEY: ${{ secrets.TAP_SSH_KEY }}
      SCOOP_BUCKET_SSH_KEY: ${{ secrets.SCOOP_BUCKET_SSH_KEY }}
