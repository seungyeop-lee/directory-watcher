version: 2

# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w -X github.com/seungyeop-lee/directory-watcher/v3/cmd.version=v{{.Version}}

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# 릴리스 노트는 tag workflow가 CHANGELOG.md의 version 절을 --release-notes로 넘긴다.
# changelog.disable을 켜면 --release-notes 파일도 읽지 않으므로 changelog 설정은 두지 않는다.

homebrew_casks:
  - repository:
      owner: seungyeop-lee
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/seungyeop-lee/directory-watcher"
    description: "Watch directories and run commands when files change"
    hooks:
      post:
        # 바이너리를 서명·공증하지 않으므로, macOS Gatekeeper가 실행을 막지 않도록 quarantine 속성을 지운다.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/directory-watcher"]
          end

# scoop-bucket에는 TAP_GITHUB_TOKEN이 아니라, 그 저장소에만 쓰기 권한이 있는 SSH deploy key로 push한다.
# 개인키는 tag workflow가 저장소 비밀값 SCOOP_BUCKET_SSH_KEY에서 넘긴다.
scoops:
  - repository:
      owner: seungyeop-lee
      name: scoop-bucket
      git:
        url: "git@github.com:seungyeop-lee/scoop-bucket.git"
        private_key: "{{ .Env.SCOOP_BUCKET_SSH_KEY }}"
    homepage: "https://github.com/seungyeop-lee/directory-watcher"
    description: "Watch directories and run commands when files change"

# Dockerfile은 goreleaser가 빌드 컨텍스트의 <TARGETPLATFORM>/ 아래에 둔 바이너리를 복사한다.
dockers_v2:
  - images:
      - "ghcr.io/seungyeop-lee/directory-watcher"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "{{.GitURL}}"
    flags:
      - "--pull"
    extra_files:
      - entrypoint.sh
