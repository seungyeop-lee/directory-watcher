# Shell for every hook command: sh (default on Unix), cmd (default on Windows), or powershell (Windows only).
# shell: sh
global:
  lifeCycle:
    onStartWatch:
      - echo 'global onStartWatch'
    onBeforeChange:
      - echo 'global onBeforeChange'
    onAfterChange:
      - echo 'global onAfterChange'
    onFinishWatch:
      - echo 'global onFinishWatch'
    # Optional event-loss notification; error context is environment data, not a template.
    # onError:
    #   - cmd: 'printenv DW_ERROR_MESSAGE'
    # Optional warning when a target's queue reaches 70% or 90% of queue.size, and when it falls back.
    # onQueueWarning:
    #   - cmd: 'printenv DW_QUEUE_TARGET DW_QUEUE_LEVEL DW_QUEUE_DIRECTION DW_QUEUE_TOP_PATHS'
watchTargets:
  - path: 'test/dir1'
    lifeCycle:
      onChange:
        - echo 'dir1 onChange'
  - path: 'test/dir2'
    lifeCycle:
      onStartWatch:
        - echo 'dir2 onStartWatch'
      onChange:
        # Write template variables outside quotes; each one becomes a single argument.
        - echo 'dir2 onChange' {{.Path}}, {{.AbsPath}}, {{.Name}}, {{.ExtName}}, {{.ParentPath}}, {{.ParentAbsPath}}, {{.Event}}, {{.IsDir}}
        - sleep 10000
        - echo 'dir2 onChange after sleep'
      onFinishWatch:
        - echo 'dir2 onFinishWatch'
    option:
      watch:
        # Patterns are relative to path. Quote them: YAML reads a leading * or ! as syntax.
        exclude:
          - 'tmp/**'
          - '**/*_test.go'
          - '**/*~'
        fileEvent: CDU # default CUD
        dirEvent: CD # default CD; none turns folder events off
      hookBatch:
        waitMillisecond: 1000 # default 100; 0 does not wait
        maxWaitMillisecond: 3000 # default 1000, or waitMillisecond if larger; not less than waitMillisecond
        deliver: lastPerPath # default last; last, lastPerPath, or each
      queue:
        size: 4096 # default 2048; more pending runs stop the watcher
      run:
        concurrency: 1 # default 1; runs of this target at the same time
        interrupt: oldest # default none; none, samePath, or oldest
  - path: 'test/dir3'
    lifeCycle:
      onStartWatch:
        - echo 'dir3 onStartWatch'
      onChange:
        - dir: "cmd"
          cmd: "pwd"
      onFinishWatch:
        - dir: "internal"
          cmd:
          - "pwd"
          - "ls -al"
    option:
      watch:
        subDir: false
