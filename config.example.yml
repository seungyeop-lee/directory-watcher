# Shell for every hook command: sh (default on Unix), cmd (default on Windows), or powershell (Windows only).
# shell: sh
global:
  lifeCycle:
    onStartWatch:
      - echo 'global onStartWatch'
    onBeforeChange:
      - echo 'global onBeforeChange'
    onAfterChange:
      - echo 'global onAfterChange'
    onFinishWatch:
      - echo 'global onFinishWatch'
    # Optional event-loss notification; error context is environment data, not a template.
    # onError:
    #   - cmd: 'printenv DW_ERROR_MESSAGE'
watchTargets:
  - path: 'test/dir1'
    lifeCycle:
      onChange:
        - echo 'dir1 onChange'
  - path: 'test/dir2'
    lifeCycle:
      onStartWatch:
        - echo 'dir2 onStartWatch'
      onChange:
        # Write template variables outside quotes; each one becomes a single argument.
        - echo 'dir2 onChange' {{.Path}}, {{.AbsPath}}, {{.Name}}, {{.ExtName}}, {{.ParentPath}}, {{.ParentAbsPath}}, {{.Event}}, {{.IsDir}}
        - sleep 10000
        - echo 'dir2 onChange after sleep'
      onFinishWatch:
        - echo 'dir2 onFinishWatch'
    option:
      watch:
        # Patterns are relative to path. Quote them: YAML reads a leading * or ! as syntax.
        exclude:
          - 'tmp/**'
          - '**/*_test.go'
          - '**/*~'
        fileEvent: CDU # default CUD
        dirEvent: CD # default CD; none turns folder events off
      hookBatch:
        waitMillisecond: 1000 # default 100
      noWait: true # default false
      interruptible: true
  - path: 'test/dir3'
    lifeCycle:
      onStartWatch:
        - echo 'dir3 onStartWatch'
      onChange:
        - dir: "cmd"
          cmd: "pwd"
      onFinishWatch:
        - dir: "internal"
          cmd:
          - "pwd"
          - "ls -al"
    option:
      watch:
        subDir: false
